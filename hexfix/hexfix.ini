; hexfix - optional enhancements for Cosmic Osmo's Hex Isle
; Place next to plasma.exe together with hexfix's d3d9.dll.
; Every option defaults to the game's original (vanilla) behaviour.

[Display]
; Frame-rate cap in frames per second. 0 = no cap (vanilla).
FrameRateLimit=0

; VSync override. -1 = use the game's own setting (Graphics.EnableVSync, vanilla)
;                  0 = force VSync off, 1 = force VSync on
VSync=-1

; Widescreen FOV fix. 1 = Hor+ field of view for screens wider than 16:9 (vanilla is
;   unchanged at 16:9 and narrower; without this, 21:9/32:9 get a >180 degree, broken view)
; 0 = original formula at every aspect ratio
WidescreenFOV=1

[Debug]
; 1 = show an FPS counter (green digits, top-left corner)
ShowFPS=0
; 1 = write hexfix.log next to the game (diagnostics)
Log=0
