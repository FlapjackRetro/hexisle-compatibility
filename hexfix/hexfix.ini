; hexfix - optional enhancements for Cosmic Osmo's Hex Isle
; Place next to plasma.exe together with hexfix's d3d9.dll.
; Every option defaults to the game's original (vanilla) behaviour.

[Display]
; Frame-rate cap in frames per second. 0 = no cap (vanilla).
FrameRateLimit=0

; VSync override. -1 = use the game's own setting (Graphics.EnableVSync, vanilla)
;                  0 = force VSync off, 1 = force VSync on
VSync=-1

; Widescreen FOV fix for the 3D camera and GUI dialogs. 1 = Hor+ field of view for screens wider
;   than 16:9 (vanilla is unchanged at 16:9 and narrower; without this, 21:9/32:9 get a >180 degree,
;   broken 3D view and horizontally squeezed GUI elements such as the in-level badge)
; 0 = original formula at every aspect ratio
WidescreenFOV=1

; Keep wide fullscreen modes across restarts. The game's startup mode list drops modes wider than
; 2560 (3840x1080, 5120x1440, ...), so it resets graphics.ini to 800x600 when one was selected.
; 1 = accept the saved mode if the graphics adapter supports it, 0 = original behaviour
KeepWideModes=1

; Resolution-independent GUI text. The game sizes each text box's texture from the screen resolution and
; draws a fixed-size font into it, so text gets smaller at high resolutions (and narrower on wide screens).
; 1 = lay text out at a fixed reference resolution and scale it with the GUI (the engine's own
; "scale with resolution" mode), 0 = original behaviour
ScaleText=1
; Reference height for ScaleText (width = height * 4/3). Lower = bigger text. Engine default: 768
TextReferenceHeight=768

[Input]
; Mouse camera fix. When steering, the game re-centres the cursor and assumes that worked; on some
; systems the cursor doesn't move (or is moved back), and queued moves are also measured against the
; new centre, so the camera occasionally leaps. 1 = always measure from the real cursor position
; (fix), 0 = original behaviour
MouseFix=1

[Debug]
; 1 = show an FPS counter (green digits, top-left corner)
ShowFPS=0
; 1 = write hexfix.log next to the game (diagnostics)
Log=0
